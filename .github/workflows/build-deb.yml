name: build-deb

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts fakeroot \
            cmake qt6-base-dev qt6-declarative-dev qt6-base-dev-tools libbluetooth-dev libgl-dev

      - name: Build package
        run: dpkg-buildpackage -b -us -uc

      - name: Collect artifacts
        run: |
          mkdir -p out
          mv ../fiilctl_*.deb out/
          dpkg-deb --info out/fiilctl_*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: fiilctl-deb
          path: out/*.deb
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.deb

  smoke-test:
    runs-on: ubuntu-24.04
    needs: deb
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fiilctl-deb
          path: out

      - name: Install the package and check it runs
        run: |
          sudo apt-get update
          sudo apt-get install -y ./out/fiilctl_*.deb
          fiilctl --list
          test -f /usr/share/applications/fiilctl.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/fiilctl.svg
          desktop-file-validate /usr/share/applications/fiilctl.desktop || true
